name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
        working-directory: backend
      - name: Lint
        run: python -m ruff check src tests
        working-directory: backend
      - name: Format check
        run: python -m ruff format --check src tests
        working-directory: backend
      - name: Django configuration check
        run: python manage.py check --settings=project_x_backend.config.settings.test
        working-directory: backend
      - name: Tests
        run: python -m pytest
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  ai:
    name: AI/CV package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
        working-directory: ai
      - name: Lint
        run: python -m ruff check src tests
        working-directory: ai
      - name: Format check
        run: python -m ruff format --check src tests
        working-directory: ai
      - name: Tests
        run: python -m pytest
        working-directory: ai

  container-builds:
    name: Container build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: ai
            context: ./ai
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
