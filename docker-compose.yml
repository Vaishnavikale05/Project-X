name: project-x-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: project_x_backend.config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-${DJANGO_SECRET_KEY}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_STORAGE_ROOT: /app/var/media
    volumes:
      - ./backend:/app
      - local_media:/app/var/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 30s
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=7); payload = json.load(response); assert payload.get('status') == 'ok' and all(value == 'ok' for value in payload.get('dependencies', {}).values())
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  celery:
    build:
      context: ./backend
    command: celery -A project_x_backend.config.celery_app worker --loglevel=INFO
    environment: *backend_environment
    volumes:
      - ./backend:/app
      - local_media:/app/var/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A project_x_backend.config.celery_app inspect ping --timeout=3 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(async r => { const type = r.headers.get('content-type') || ''; const html = await r.text(); if (!r.ok || !type.includes('text/html') || !html.includes('<div id="root"></div>')) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    environment:
      AI_SERVICE_PORT: 8010
    ports:
      - "8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  local_media:
  frontend_node_modules:
